name: 💡 Idea or request
description: A new feature, a change, or a whole new plugin you'd like to see
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Ideas of every size are welcome – "it'd be nice if…" is a great start. Criticism is welcome too.
  - type: dropdown
    id: plugin
    attributes:
      label: Is this about a plugin?
      options: [PotentialBreaks, PotentialPatina, A new plugin, Something else]
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and how would you use it in a beat?
    validations:
      required: true
